version: 0.2

# Optional CI. Production deploys from the Mac — see DEPLOY.md.
env:
  variables:
    AWS_REGION: us-east-2
    APP_DOMAIN: ui-component-aggregator.com

phases:
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run lint
      - npm run typecheck
      - npm test
      - npm run lambda:build
  post_build:
    commands:
      - |
        if [ -n "$FUNCTION_NAME" ] && [ -f dist/function.zip ]; then
          aws lambda update-function-code --region $AWS_REGION --function-name $FUNCTION_NAME --zip-file fileb://dist/function.zip
          aws lambda wait function-updated --region $AWS_REGION --function-name $FUNCTION_NAME
        fi

artifacts:
  files:
    - dist/function.zip
    - dist/static/**/*
    - infra/**/*
    - aws/**/*
    - buildspec.yml
    - DEPLOY.md
